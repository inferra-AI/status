# Every 5 minutes: probe each component, record the result, publish the page.
name: check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["site/data.json", "site/api/**"]

permissions: {}

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check.py
      - name: Save results
        run: |
          git config user.name "inferra-status"
          git config user.email "inferra-status@users.noreply.github.com"
          git add site/data.json site/api/summary.json
          git commit -qm "check $(date -u +%FT%TZ)" || exit 0
          git pull -q --rebase && git push -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
