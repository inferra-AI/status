# Probe each component every 5 minutes and publish the page.
#
# GitHub delays scheduled runs on quiet repositories by hours, so one job
# loops: it checks every 5 minutes for up to ~5h50m, then ends. The schedule
# (and the queued run waiting on the concurrency group) starts the next loop,
# so delays only affect when a loop starts, not every check.
name: check
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Check every 5 minutes, publish after each round
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "inferra-status"
          git config user.email "inferra-status@users.noreply.github.com"
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            started=$(date +%s)
            git pull -q --rebase || true
            python3 scripts/check.py
            git add site/data.json site/api/summary.json
            if git commit -qm "check $(date -u +%FT%TZ)"; then
              git pull -q --rebase && git push -q && gh workflow run pages.yml --ref main || true
            fi
            sleep $(( 300 - ($(date +%s) - started) % 300 ))
          done
