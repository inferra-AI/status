version: 3

# The status page on Inferra's own dev platform: every push to main builds site/
# with the Paketo web-servers buildpack (nginx) and serves a copy on dev, so
# changes can be checked there before GitHub Pages publishes status.inferralab.com.
# This copy runs ON the platform it reports on, so it is a preview, not an
# outage monitor: the public page (GitHub Actions + Pages) stays outside Inferra.
# Same app as v1: port 8080, health /, 0.5 cpu / 512Mi, 1 instance. No database,
# no services, no secrets, no runtime env vars.
name: status
type: web
cpu: 0.5
memory: 512Mi
instances: 1
port: 8080
health:
  path: /
build:
  env:
    BP_WEB_SERVER: nginx
    BP_WEB_SERVER_ROOT: site
  # Rebuild only when the page itself changes. The check loop commits
  # site/data.json and site/api/summary.json every 5 minutes; those are data,
  # not code, and must not rebuild this preview. When `watch` is set, only
  # these paths trigger a build (a changed app.yaml still rebuilds). A new
  # file under site/ must be added here. The dev copy shows the data from its
  # last build; the real status page is GitHub Pages.
  watch:
    - site/index.html
    - site/favicon.svg
    - site/fonts/
